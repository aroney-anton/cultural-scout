<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>See the whole universe — Cultural Scout</title>
<style>
  :root{
    --ink:#141414; --mute:#6b665c; --line:#e6e3db; --card:#fcfbf9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);background:#fff;transition:background .4s ease;
  }
  body.mode-explore{background:#05060a;color:#e9e7e2}

  /* ---- tab nav ---- */
  nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;
    display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(0,0,0,.05);border:1px solid var(--line);backdrop-filter:blur(8px)}
  body.mode-explore nav{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  nav button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-size:13px;letter-spacing:.04em;
    padding:8px 20px;border-radius:999px;color:var(--mute)}
  body.mode-explore nav button{color:#aaa6a0}
  nav button.on{background:var(--ink);color:#fff}
  body.mode-explore nav button.on{background:#fff;color:#05060a}

  .view{display:none}
  .view.on{display:block}

  /* ---- SEARCH VIEW ---- */
  #view-search .wrap{max-width:860px;margin:0 auto;padding:92px 24px 120px}
  header.s{margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:26px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:44px;line-height:1.04;margin:0 0 14px;letter-spacing:-.01em}
  .lede{font-size:16px;color:#3a382f;margin:0;max-width:64ch}
  .lede .label{color:var(--ink);font-weight:600}
  .statline{display:block;margin-top:12px;font-size:13px;color:var(--mute);letter-spacing:.02em}

  .search{position:sticky;top:0;background:#fff;padding:20px 0 14px;z-index:5;border-bottom:1px solid var(--line);margin-bottom:8px}
  #q{width:100%;font-size:22px;font-family:Georgia,serif;padding:14px 16px;border:1.5px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink)}
  #q:focus{outline:none;box-shadow:0 0 0 3px rgba(20,20,20,.08)}
  .subbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:11px;flex-wrap:wrap}
  .hints{font-size:13px;color:var(--mute)}
  .hints a{color:var(--mute);text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-right:14px}
  .hints a:hover{color:var(--ink)}
  .srcbtn{font-size:12px;letter-spacing:.04em;padding:7px 13px;border:1px solid var(--line);background:transparent;border-radius:2px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .srcbtn:hover{border-color:var(--ink)}

  /* source-list modal */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(20,18,14,.42);display:none;align-items:flex-start;justify-content:center;padding:80px 20px 40px}
  .modal.open{display:flex}
  .modal-card{background:#fff;border:1px solid var(--line);border-radius:5px;max-width:680px;width:100%;max-height:80vh;overflow-y:auto;padding:26px 30px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .modal-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .modal-head h2{font-family:Georgia,serif;font-size:24px;margin:0}
  .mclose{cursor:pointer;color:var(--mute);font-size:26px;line-height:1}.mclose:hover{color:var(--ink)}
  .modal-sub{font-size:13px;color:var(--mute);margin:6px 0 20px}
  .src-group{margin-bottom:18px}
  .src-group h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .src-item{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:14px}
  .src-item a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .src-item a:hover{border-color:var(--ink)}
  .src-item .off{font-size:11px;color:#b6b1a6;letter-spacing:.03em}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 4px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--mute);letter-spacing:.02em}
  .copy{font-size:12px;letter-spacing:.04em;padding:7px 12px;border:1px solid var(--ink);background:transparent;border-radius:2px;cursor:pointer;color:var(--ink)}
  .copy:hover{background:var(--ink);color:#fff}
  .copy:disabled{opacity:.35;cursor:default;border-color:var(--line)}

  /* need-mix: the distribution of need tags across the current results, with a
     filter-against-the-dominant-need dial. Pure client-side post-filter. */
  .needmix{margin:12px 2px 2px}
  .nm-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-bottom:9px}
  .nm-bar span{height:100%;transition:width .2s}
  .nm-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .nm-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:2px}
  .nm-chip{font-size:11.5px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink);background:transparent;user-select:none}
  .nm-chip:hover{border-color:var(--ink)}
  .nm-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .nm-chip .pct{color:var(--mute)}
  .nm-chip.ex{opacity:.5;text-decoration:line-through;border-style:dashed}
  .nm-chip.ex .dot{filter:grayscale(1)}
  .nm-act{font-size:11.5px;letter-spacing:.03em;padding:4px 11px;border:1px solid var(--ink);background:transparent;border-radius:20px;cursor:pointer;color:var(--ink)}
  .nm-act:hover{background:var(--ink);color:#fff}

  /* themes: emergent semantic clusters of the current search results, found
     in-browser from the build-time embeddings (no model on the page). Labels
     are keyword-extracted (TF-IDF of the cluster vs the rest of the matched
     set); clicking a chip filters results to that cluster. */
  .themes{margin:12px 2px 2px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
  .th-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:5px 2px 0 0;white-space:nowrap}
  .th-chip{font-size:12px;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);background:transparent;user-select:none;max-width:340px}
  .th-chip b{font-weight:600}
  .th-chip:hover{border-color:var(--ink)}
  .th-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .th-chip.on .th-n{color:#fff}
  .th-chip .th-n{color:var(--mute);font-variant-numeric:tabular-nums}
  .th-clear{font-size:11.5px;padding:5px 10px;border:1px dashed var(--line);border-radius:6px;cursor:pointer;color:var(--mute);background:transparent}
  .th-clear:hover{border-color:var(--ink);color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:3px;padding:16px 18px;margin:12px 0}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:7px}
  .sub{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  .badge{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line)}
  .badge.fwd{color:#2f6f6b;border-color:#bcd6d3}
  .badge.runs{color:#7a5aa0;border-color:#d7cae6}
  .card h3{font-family:Georgia,serif;font-size:19px;line-height:1.25;margin:2px 0 6px;font-weight:600}
  .card h3 a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .card h3 a:hover{border-color:var(--ink)}
  .summary{margin:0;color:#33312c}
  .more{font-size:13.5px;color:var(--mute);margin-top:10px;display:none}
  .more.show{display:block}
  .more p{margin:4px 0}.more b{color:var(--ink)}
  .toggle{font-size:12px;color:var(--mute);cursor:pointer;margin-top:9px;display:inline-block;text-decoration:underline;text-underline-offset:2px}
  .src{color:var(--mute);text-decoration:none}.src:hover{color:var(--ink)}

  /* ---- VITAL SIGNS VIEW ---- */
  #view-vitals .wrap{max-width:1080px;margin:0 auto;padding:92px 24px 120px}
  .v-head{margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:20px}
  .v-head h1{font-size:38px}
  .v-search{margin:18px 0 6px}
  #vq{width:100%;max-width:560px;font-size:17px;font-family:Georgia,serif;padding:11px 14px;border:1.5px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink)}
  #vq:focus{outline:none;box-shadow:0 0 0 3px rgba(20,20,20,.08)}
  .v-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 10px;flex-wrap:wrap}
  .v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
  .tile:hover{border-color:var(--ink)}
  .tile.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(20,20,20,.07)}
  .tile .t-name{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .tile .t-value{font-family:Georgia,serif;font-size:18px;line-height:1.2;font-weight:600;margin-bottom:3px}
  .tile .t-delta{font-size:11.5px;color:#3a382f;min-height:15px}
  .tile .t-delta.up{color:#2f6f3e}.tile .t-delta.down{color:#a03d2e}
  .tile .t-meta{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10px;color:var(--mute);flex-wrap:wrap}
  .v-brief{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:3px;padding:16px 20px;margin:4px 0 22px}
  .v-brief .b-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .v-brief p{margin:7px 0;font-size:14.5px;line-height:1.6;color:#2e2c26}
  .t-chip{border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:.04em;text-transform:uppercase}
  .t-chip.warn{color:#9a6b1a;border-color:#e2cb96}
  .tile svg{display:block;margin-top:8px;width:100%;height:28px}
  .tile polyline{fill:none;stroke:#8a8474;stroke-width:1.5}
  .v-detail{background:#fff;border:1px solid var(--ink);border-radius:3px;padding:18px 20px;margin:14px 0;display:none}
  .v-detail.show{display:block}
  .v-detail h3{font-family:Georgia,serif;font-size:20px;margin:0 0 8px}
  .v-detail p{margin:6px 0;font-size:14px;color:#33312c}
  .v-detail .d-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .v-detail blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--line);font-style:italic;color:#4a473e;font-size:13.5px}
  .v-detail .d-cite{font-size:13px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:2px;margin:10px 0;font-family:ui-monospace,Menlo,monospace}
  .fg-section{margin-top:44px}
  .fg-section h2{font-family:Georgia,serif;font-size:24px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
  .fg-sub{font-size:13px;color:var(--mute);margin:0 0 16px}
  .fg-group h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .fg-item{padding:9px 2px;border-bottom:1px solid #f0ede6;font-size:13.5px}
  .fg-item a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
  .fg-item a:hover{border-color:var(--ink)}
  .fg-item .fg-what{color:#33312c;margin:3px 0 1px}
  .fg-item .fg-reach{color:var(--mute);font-size:12.5px}
  .fg-chip{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:1px 6px;color:var(--mute);margin-left:6px}

  /* ---- PULSE (need distribution over time, Search tab headline) ---- */
  .pulse{border:1px solid var(--line);border-radius:3px;background:var(--card);padding:18px 20px 12px;margin:24px 0 4px}
  .pulse .p-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pulse h2{font-family:Georgia,serif;font-size:17px;font-weight:600;margin:0}
  .pulse .p-sub{font-size:11.5px;color:var(--mute)}
  .pulse svg{display:block;width:100%;height:auto;margin-top:10px}
  .pulse svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .pulse .p-note{font-size:11px;color:var(--mute);margin:8px 0 2px;line-height:1.5}
  .pulse .p-copy{font-size:11px;letter-spacing:.04em;padding:5px 10px;border:1px solid var(--line);background:transparent;border-radius:2px;cursor:pointer;color:var(--mute)}
  .pulse .p-copy:hover{border-color:var(--ink);color:var(--ink)}

  /* ---- RECEIPTS (Search-tab footer + modal) ---- */
  .foot{margin-top:54px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute);line-height:1.6}
  .foot a{color:var(--mute);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
  .foot a:hover{color:var(--ink)}
  .r-intro{font-size:14px;color:#33312c;line-height:1.6;border-left:3px solid var(--ink);padding:2px 0 2px 16px;margin:4px 0 20px}
  .r-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px 20px;margin:12px 0}
  .r-card h3{font-family:Georgia,serif;font-size:17px;margin:0 0 6px;font-weight:600}
  .r-card p{margin:0;font-size:14px;color:#33312c;line-height:1.6}
  .r-score{margin-top:40px}
  .r-score h2{font-family:Georgia,serif;font-size:24px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
  .r-method{font-size:13.5px;color:#4a473e;line-height:1.6;margin:0 0 16px}
  .r-empty{background:var(--card);border:1px dashed var(--line);border-radius:3px;padding:14px 18px;font-size:13.5px;color:var(--mute)}
  .r-entry{border:1px solid var(--line);border-left-width:3px;border-radius:3px;background:var(--card);padding:13px 16px;margin:10px 0;font-size:13.5px}
  .r-entry .re-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .r-entry .re-title{font-family:Georgia,serif;font-weight:600;font-size:15px}
  .r-verdict{font-size:10px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--mute)}
  .r-verdict.matured{color:#2f6f3e;border-color:#bcd6c3}
  .r-verdict.building{color:#3a5a9b;border-color:#b9c6e2}
  .r-verdict.faded{color:#6b665c}
  .r-verdict.wrong{color:#a03d2e;border-color:#e2b9ae}

  /* ---- PROVENANCE (Field Guide, editorial intake breakdown) ---- */
  .prov{border:1px solid var(--line);border-radius:3px;background:var(--card);padding:16px 20px;margin:4px 0 24px}
  .prov h3{font-family:Georgia,serif;font-size:17px;font-weight:600;margin:0 0 2px}
  .prov .prov-line{font-size:13px;color:#33312c;margin:6px 0 14px;line-height:1.55}
  .prov .prov-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 28px}
  .prov h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .pv-row{display:flex;align-items:center;gap:8px;padding:2.5px 0;font-size:12px;color:#33312c}
  .pv-name{flex:0 0 128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-bar{flex:1;height:7px;background:#eeebe3;border-radius:2px;overflow:hidden}
  .pv-bar i{display:block;height:100%;background:#8a8474}
  .pv-n{flex:0 0 24px;text-align:right;color:var(--mute);font-size:11px}
  .prov .prov-note{font-size:11px;color:var(--mute);margin:12px 0 0;line-height:1.5}

  /* ---- EXPLORE VIEW ---- */
  #view-explore{position:fixed;inset:0}
  #cv{position:absolute;inset:0;display:block;cursor:grab}
  #cv:active{cursor:grabbing}
  .ex-title{position:absolute;top:74px;left:28px;z-index:10;pointer-events:none}
  .ex-title h2{font-family:Georgia,serif;font-weight:600;font-size:22px;margin:0;color:#fff}
  .ex-title p{margin:4px 0 0;font-size:12.5px;color:#8b8780;max-width:34ch}
  .anchor-label{position:absolute;z-index:8;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    transform:translate(-50%,-150%);pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.9);white-space:nowrap}
  .sun-label{font-size:15px;color:#fff;letter-spacing:.18em;z-index:9;text-shadow:0 0 16px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.9)}
  .cluster-label{font-size:10.5px;letter-spacing:.04em;text-transform:none;font-weight:600;z-index:9;text-shadow:0 0 12px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.9)}
  .ex-search{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:12;width:min(420px,72vw)}
  .ex-search input{width:100%;font:15px Georgia,serif;padding:10px 14px;background:rgba(11,13,19,.78);
    border:1px solid rgba(255,255,255,.25);border-radius:3px;color:#e9e7e2;backdrop-filter:blur(6px)}
  .ex-search input::placeholder{color:#6f6b64}
  .ex-search input:focus{outline:none;border-color:rgba(255,255,255,.55)}
  .ex-count{margin-top:6px;font-size:12px;color:#8b8780;text-align:center;min-height:15px;text-shadow:0 0 6px #05060a}
  .ex-actions{text-align:center;margin-top:5px;display:none}
  .ex-actions.show{display:block}
  .ex-actions button{font:11px/1 inherit;letter-spacing:.06em;padding:5px 11px;border:1px solid rgba(255,255,255,.22);
    background:rgba(11,13,19,.6);border-radius:2px;color:#aaa6a0;cursor:pointer}
  .ex-actions button:hover{border-color:rgba(255,255,255,.5);color:#e9e7e2}
  .legend{position:absolute;left:28px;bottom:24px;z-index:10;font-size:12.5px;color:#cfccc6}
  .legend .row{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;opacity:.85}
  .legend .row:hover{opacity:1}
  .legend .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .hint-3d{position:absolute;right:28px;bottom:24px;z-index:10;font-size:12px;color:#6f6b64;text-align:right;line-height:1.7}
  /* ---- planet interior (look & feel) ---- */
  #warp{position:absolute;inset:0;z-index:34;pointer-events:none;opacity:0;transition:opacity .9s ease}
  #planet-ui{position:absolute;top:74px;left:28px;z-index:11;display:none;max-width:340px}
  #planet-ui h2{font-family:Georgia,serif;font-weight:600;font-size:22px;margin:0;color:#fff}
  #planet-ui .sub{margin:6px 0 12px;font-size:12.5px;color:#8b8780;line-height:1.5}
  #planet-back{font:11px/1 inherit;letter-spacing:.06em;padding:7px 12px;border:1px solid rgba(255,255,255,.22);background:rgba(11,13,19,.6);border-radius:2px;color:#aaa6a0;cursor:pointer}
  #planet-back:hover{border-color:rgba(255,255,255,.5);color:#e9e7e2}
  .code-label{text-transform:none;font-size:14px;letter-spacing:.05em;font-weight:600}
  .code-label .cl-status{display:block;font-size:9px;letter-spacing:.14em;font-weight:500;opacity:.75;margin-top:2px}
  #panel .stat2{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  #panel .swmini{display:flex;height:16px;border-radius:2px;overflow:hidden;margin:2px 0 12px;border:1px solid rgba(255,255,255,.12)}
  #panel .swmini i{flex:1}
  #panel .pcollage{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 16px;border-radius:3px;overflow:hidden}
  #panel .pcollage a{display:block;height:96px;overflow:hidden;background:rgba(255,255,255,.04)}
  #panel .pcollage img{height:96px;width:auto;display:block}
  #panel.wide .pcollage a,#panel.wide .pcollage img{height:118px}
  #panel .chiprow{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
  #panel .chip2{font-size:10.5px;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:2px 9px;color:#c9c6c0}

  const basePos=worldPos.map(p=>p.clone());
  let rel=null,aff=null;

  // ---- orbital homes: every star is a planet orbiting a sun.
  // home = {anchor, off, axis, speed}; rendered position = anchor + off
  // rotated by (time * speed) around axis. Changing a star's home (e.g. to
  // the search sun) makes it drift into a new orbit.
  const ORIGIN=new THREE.Vector3(0,0,0), YAXIS=new THREE.Vector3(0,1,0);
  const axes={},speeds={};
  {let ai=0;for(const k in anchors){const rr=mul(101+ai*13);
    axes[k]=new THREE.Vector3(rr()-.5,1.1,rr()-.5).normalize();
    speeds[k]=.0085+.0075*rr();ai++;}}   // natural orbit speed: slowed 25% then a further 75% (2026-06-10)
  const origHomes=[],homes=[];
  for(let i=0;i<N;i++){
    const k=subOf[i];
    const h={anchor:anchors[k],off:worldPos[i].clone().sub(anchors[k]),axis:axes[k],speed:speeds[k]};
    origHomes.push(h);homes.push(h);
  }

  // per-signal content-word sets + corpus document frequency (lazy, cached) —
  // used to give NON-matching stars a graded adjacency to the query topic.
  const wordCache=new Array(N);
  function sigWords(i){
    if(!wordCache[i]){const s=DATA[i];const set=new Set();
      for(const f of ["title","summary","novelty_note","cross_substrate_notes"])
        for(const w of (((s[f]||"")+"").toLowerCase().match(/[a-z]{4,}/g)||[]))set.add(w);
      wordCache[i]=set;}
    return wordCache[i];
  }
  let DF=null;
  function ensureDF(){if(DF)return;DF={};for(let i=0;i<N;i++)for(const w of sigWords(i))DF[w]=(DF[w]||0)+1;}
  let focusedTheme=null;
  function release(msg){
    rel=null;aff=null;focusedTheme=null;window.__focusedTheme=null;
    activeClusters=0;                                   // dismiss any theme suns
    excount.textContent=msg||"";
    for(let i=0;i<N;i++)homes[i]=origHomes[i];          // planets return to their need-suns
    setSearchSun(null);paintColors();
  }
  // Shared choreography for text queries AND theme clicks: a sun is born at
  // the centre, ranked matches take up orbit around it (golden spiral,
  // best-first), every other star re-sorts radially by lexical adjacency to
  // the matched set (IDF-weighted word overlap — no LLM), need-suns dim.
  function focusOn(idx,label,colorHex,countMsg,clusters){
    const GA=Math.PI*(3-Math.sqrt(5));
    const m=idx.length;
    if(clusters&&clusters.length>=2){
      // SEMANTIC CLUSTER LAYOUT: each theme gets its own sun ringed around the
      // central query sun; its planets orbit that theme sun. Deterministic for a
      // given query (cluster assignment + cluster order are stable).
      const K=Math.min(clusters.length,MAXCLUST);
      for(let c=0;c<K;c++){
        const cl=clusters[c];
        const aPos=clusterDir(c,K).multiplyScalar(CLUSTER_R);
        clustAnchor[c].copy(aPos);
        const members=cl.members.slice().sort((a,b)=>(rel[idxOf.get(b)]||0)-(rel[idxOf.get(a)]||0));
        const mm=members.length;
        members.forEach((s,kk)=>{
          const i=idxOf.get(s);if(i==null)return;
          const t=mm===1?0:kk/(mm-1);
          const rad=5+12*Math.pow(t,0.7);        // central planet hugs the theme sun
          const y=mm===1?0:1-2*((kk+0.5)/mm);
          const rxz=Math.sqrt(Math.max(0,1-y*y));
          const th=kk*GA;
          homes[i]={anchor:clustAnchor[c],axis:clustAxis[c],speed:.03,
            off:new THREE.Vector3(Math.cos(th)*rxz*rad,y*rad,Math.sin(th)*rxz*rad)};
        });
        const cc=clusterColor(cl);
        clustSuns[c].material.uniforms.uColor.value.set(cc);
        clustGlows[c].material.color.set(cc);
        clustLabels[c].style.color=cc;
        clustLabels[c].textContent=(cl.keywords||[]).filter(Boolean).join(" · ")||"theme";
      }
      activeClusters=K;
    }else{
      // single relevance golden-spiral (fallback: no vectors, or too few matches)
      activeClusters=0;
      for(let k=0;k<m;k++){
        const i=idx[k];
        const t=m===1?0:k/(m-1);
        const rad=11+31*Math.pow(t,0.7);          // rank → orbit radius (innermost clears the sun)
        const y=m===1?0:1-2*((k+0.5)/m);          // even spread top-to-bottom
        const rxz=Math.sqrt(Math.max(0,1-y*y));
        const th=k*GA;
        homes[i]={anchor:ORIGIN,axis:YAXIS,speed:.045,
          off:new THREE.Vector3(Math.cos(th)*rxz*rad,y*rad,Math.sin(th)*rxz*rad)};
      }
    }
    aff=new Array(N).fill(0);
    ensureDF();
    const wgt={};
    for(const i of idx)for(const w of sigWords(i))wgt[w]=(wgt[w]||0)+1;
    for(const w in wgt)wgt[w]*=Math.log(N/DF[w]);
    let amax=0;
    for(let i=0;i<N;i++){
      if(rel[i]>0){aff[i]=1;continue;}
      let sum=0;for(const w of sigWords(i))if(wgt[w])sum+=wgt[w];

    }
    if(amax>0)for(let i=0;i<N;i++)if(rel[i]<=0)aff[i]=Math.pow(aff[i]/amax,2); // sharpen: only true neighbours hug the cluster
    for(let i=0;i<N;i++)if(rel[i]<=0){
      const off=basePos[i].clone().normalize().multiplyScalar(110-58*aff[i]);  // aff 1 → r52, aff 0 → r110
      homes[i]={anchor:ORIGIN,axis:YAXIS,speed:.006,off:off};
    }

    lineIdx=idx.slice(0,MAXLINES);lineMat.color.set(colorHex);
    pulse.material.color.set(colorHex);
    bgTarget.copy(bgBase).lerp(new THREE.Color(colorHex),0.07);  // the whole universe leans toward the focus
    setSearchSun(label);
    excount.textContent=countMsg;

  }
  function applyQuery(q){

    let max=0;for(const s of scores)if(s>max)max=s;
    rel=scores.map(s=>max?s/max:0);focusedTheme=null;window.__focusedTheme=null;
    const idx=[];for(let i=0;i<N;i++)if(rel[i]>0)idx.push(i);

    const clusters=window.__clusterSignals?window.__clusterSignals(idx.map(i=>DATA[i]),q):null;
    const msg=(clusters&&clusters.length>=2)
      ? idx.length+" signals in "+Math.min(clusters.length,MAXCLUST)+" themes orbiting your query · related ones form the ring"

  // Theme focus: same animation, but the new sun IS the theme — its members

  function applyTheme(k){

  // ---- node title labels (above each star, in its substrate colour) ----

  const labelEls=new Array(N);
  const TRUNC=t=>(t&&t.length>34)?t.slice(0,33)+"…":(t||"");
  for(let i=0;i<N;i++){const d=document.createElement("div");d.className="node-label";d.textContent=TRUNC(DATA[i].title);d.style.color=COL[subOf[i]];view.appendChild(d);labelEls[i]=d;}
  const projV=new THREE.Vector3();
  function positionLabels(){const r=cv.getBoundingClientRect();const camP=camera.position;

    for(let i=0;i<N;i++){const el=labelEls[i];projV.copy(worldPos[i]).project(camera);
      if(projV.z>1){el.style.display="none";continue;}
      if(rel&&rel[i]<=0&&i!==hoverI){el.style.display="none";continue;} // query gravity: unmatched stars lose their labels

  let hoverI=-1;const v=new THREE.Vector3();
  function nearest(mx,my){const rect=cv.getBoundingClientRect();let best=-1,bd=16*16;
    for(let i=0;i<N;i++){if(rel&&rel[i]<=0&&(!aff||aff[i]<0.25))continue;v.copy(worldPos[i]).project(camera);if(v.z>1)continue;const sx=rect.left+(v.x*.5+.5)*rect.width,sy=rect.top+(-v.y*.5+.5)*rect.height;const dx=sx-mx,dy=sy-my,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}return best;}

  function esc(t){return (t||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}
  function fmtDate(d){d=d||"";return /\(approx\)/.test(d)?("~"+d.replace(/\s*\(approx\)\s*/,"")):d;}
  function openPanel(s,sub){pbody.innerHTML=`<div class="psub" style="color:${COL[sub]}">${esc(NAME(sub))}</div><div class="pmeta">${esc(s.source)} · ${esc(fmtDate(s.date))}${(s._runs||[]).length>1?` · seen in ${s._runs.length} runs`:""}</div><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p>${s.novelty_note?`<div class="pnote"><b>Novelty:</b> ${esc(s.novelty_note)}</div>`:""}${s.cross_substrate_notes?`<div class="pnote"><b>Crosscurrents:</b> ${esc(s.cross_substrate_notes)}</div>`:""}<a class="go" href="${esc(s.url)}" target="_blank" rel="noopener">Read the source →</a>`;panel.classList.remove("wide");panel.classList.add("open");}

  // ---- theme suns: descriptions + click-to-read (from NEED_TAXONOMY.md) ----
  const NEED_DESC={

    "Kinship":{one:"Build me the structures that put me in a room with my people.",
      body:"The need for unmediated bodily togetherness, now deliberately built rather than assumed: gatherings, sleepovers, scenes, markets, mutual aid, mentorship — plus the diagnoses of togetherness failing (phones, automated intimacy, dead dancefloors). Togetherness has become infrastructure, engineered on purpose because it no longer happens by default."},
    "Settling Accounts":{one:"See the record corrected, and the losses properly held.",
      body:"The need for a past that has been fairly judged and properly mourned: recantations, canon recovery, restitution, biopic and legacy wars, archive rescue, grief given durable form. The single largest engine in this corpus — the culture compulsively reopens the past to re-judge it or recover what was wrongly buried."},
    "Self-Authorship":{one:"I write me — not the platform, the estate, or the algorithm.",

  };

  // ---- planet interior: fly INTO a need-sun to explore its semiotic codes ----
  // (pilot: needs present in window.CODES; codes orbit an inner core, each

  let interior=null,interiorParts=null,flyK=null,flyPhase=0;

  function enterPlanet(k){

    flyK=k;flyPhase=1;controls.enabled=false;
    warp.style.background=`radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, rgba(242,237,228,1) 100%)`;
    try{history.replaceState(null,"","#explore&lookfeel="+encodeURIComponent(k));}catch(e){}
  }
  function finishEnter(){
    warp.style.opacity=1;
    setTimeout(()=>{
      interior=flyK;flyPhase=0;flyK=null;
      buildInterior(interior);
      setConstellationVisible(false);
      camera.position.copy(INT_C).add(tmp.set(0,6,50));
      controls.target.copy(INT_C);
      bgTarget.set(0xeae5dc);
      controls.enabled=true;controls.autoRotate=true;
      animateInterior(clock.getElapsedTime());
      warp.style.opacity=0;
    },1000);
  }
  function exitPlanet(){
    if(!interior)return;
    panel.classList.remove("open");
    warp.style.opacity=1;
    setTimeout(()=>{
      disposeInterior();
      setConstellationVisible(true);
      interior=null;
      camera.position.set(0,30,210);controls.target.set(0,0,0);
      bgTarget.copy(bgBase);
      controls.autoRotate=true;
      warp.style.opacity=0;
      try{history.replaceState(null,"","#explore");}catch(e){}
    },1000);
  }
  const civ=new THREE.Vector3();
  function animateInterior(time){
    const P=interiorParts;if(!P)return;
    const s=P.coreGlow;const gs=74*(1+.05*Math.sin(time*.8));s.scale.set(gs,gs,1);
    const rct2=cv.getBoundingClientRect();
    for(const n of P.nodes){
      civ.copy(n.off).applyAxisAngle(YAXIS,time*.05);
      n.node.position.copy(INT_C).add(civ);
      n.node.position.y+=Math.sin(time*.7+n.phase)*1.1;
      n.glow.position.copy(n.node.position);
      const g2=n.glowBase*(1+.06*Math.sin(time*1.1+n.phase));n.glow.scale.set(g2,g2,1);
      if(n.halo){n.halo.position.copy(n.node.position);const h2=58*(1+.08*Math.sin(time*.6+n.phase));n.halo.scale.set(h2,h2,1);}
      for(const st of n.sats){
        st.mesh.position.copy(n.node.position);
        st.mesh.position.x+=Math.cos(time*st.sp+st.ph)*st.r;
        st.mesh.position.z+=Math.sin(time*st.sp+st.ph)*st.r;
        st.mesh.position.y+=Math.sin(time*.9+st.ph)*1.1;
      }
      tmp.copy(n.node.position).project(camera);
      const vis2=tmp.z<1;
      n.lab.style.display=vis2?"block":"none";
      if(vis2){n.lab.style.left=(rct2.left+(tmp.x*.5+.5)*rct2.width)+"px";
        n.lab.style.top=(rct2.top+(-tmp.y*.5+.5)*rct2.height-14)+"px";}
    }
  }
  function codeAt(mx,my){
    if(!interiorParts)return null;
    const rect=cv.getBoundingClientRect();let best=null,bd=30*30;
    for(const n of interiorParts.nodes){tmp.copy(n.node.position).project(camera);if(tmp.z>1)continue;
      const sx=rect.left+(tmp.x*.5+.5)*rect.width,sy=rect.top+(-tmp.y*.5+.5)*rect.height;
      const dx=sx-mx,dy=sy-my,d=dx*dx+dy*dy;if(d<bd){bd=d;best=n.c;}}
    return best;}
  function openCodePanel(c){
    const hex=codeColor(c,interior);
    const imgs=c.evidence.flatMap(e2=>(e2.image_refs||[]).map(u=>({u,a:e2.url,s:e2.source}))).slice(0,15);
    pbody.innerHTML=`<div class="psub" style="color:${hex}">${esc(c.name)}<span class="stat2" style="color:${hex}">${esc(c.status)}</span></div>
      <h3 style="font-size:18px">${esc(c.one_liner)}</h3>
      ${imgs.length?`<div class="pcollage">${imgs.map(i=>`<a href="${esc(i.a)}" target="_blank" rel="noopener" title="${esc(i.s)}"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(i.u)}" alt="" onerror="this.parentElement.style.display='none'"></a>`).join("")}</div>`:""}
      <div class="swmini">${(c.visual.palette||[]).map(p=>`<i style="background:${esc(p.hex)}" title="${esc(p.name)} ${esc(p.hex)}"></i>`).join("")}</div>
      <p style="font-size:13px">${esc(c.definition)}</p>
      <div class="plabel">Visual register</div>
      <div class="chiprow">${[...(c.visual.materials_textures||[]),...(c.visual.composition||[])].slice(0,8).map(x=>`<span class="chip2">${esc(x)}</span>`).join("")}</div>
      <div class="plabel">Verbal register</div>
      <div class="chiprow">${(c.verbal.lexicon||[]).slice(0,9).map(x=>`<span class="chip2">${esc(x)}</span>`).join("")}</div>
      ${(c.verbal.sample_phrases||[]).slice(0,2).map(q=>`<blockquote>“${esc(q.quote)}” <a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.source)} →</a></blockquote>`).join("")}
      <div class="pnote"><b>Against:</b> ${esc(c.tensions)}</div>
      <div class="pnote"><b>Execution:</b> ${esc(c.execution_notes)}</div>
      <div class="plabel">Evidence</div>
      ${c.evidence.slice(0,5).map(e2=>`<p style="font-size:12px;margin:3px 0"><a style="color:#c9c6c0" href="${esc(e2.url)}" target="_blank" rel="noopener">${esc(e2.source)} →</a></p>`).join("")}
      <div class="pnote" style="font-size:11px">Imagery embedded live from the publishers' servers — nothing stored. Trajectory: ${c.history.map(h=>`${esc(h.run)} ${esc(h.change)}`).join(" → ")}</div>`;
    panel.classList.add("open","wide");
  }
  window.__enterPlanet=enterPlanet; // theme panel button hooks in here

  // an occasional shooting star, far out in the deep field
  const trailN=16,trailPos=new Float32Array(trailN*3);
  const trailGeo=new THREE.BufferGeometry();trailGeo.setAttribute("position",new THREE.BufferAttribute(trailPos,3));
  const trailMat=new THREE.LineBasicMaterial({color:0xcfd8ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.Line(trailGeo,trailMat));
  const metFrom=new THREE.Vector3(),metTo=new THREE.Vector3();
  let metStart=-10,metNext=7+Math.random()*15;

  const tmp=new THREE.Vector3(),orbV=new THREE.Vector3();
  const clock=new THREE.Clock();
  let frameN=0;
  function frame(){controls.update();
    const time=clock.getElapsedTime();
    if(entrance){ // arrival: dolly in from deep space, cancelled by any touch
      camera.position.lerp(ENTRANCE_TARGET,0.028);
      if(camera.position.distanceTo(ENTRANCE_TARGET)<2)entrance=false;
    }
    if(flyPhase===1){ // diving into a need-sun (look & feel)
      controls.target.lerp(anchors[flyK],0.11);
      camera.position.lerp(anchors[flyK],0.095);
      if(camera.position.distanceTo(anchors[flyK])<22){flyPhase=2;finishEnter();}
    }
    dofMat.uniforms.uTime.value=time;          // star twinkle
    dofMat.uniforms.uFade.value=Math.min(1,time/1.6);     // stars resolve from black
    if(time<1.9&&!rel){const f=Math.min(1,time/1.6);      // suns resolve with them
      for(const k in suns){suns[k].material.uniforms.uOpacity.value=f;sunGlows[k].material.opacity=.5*f;}}
    // atmosphere drifts toward (or back from) the focus colour
    bgCur.lerp(bgTarget,0.035);renderer.setClearColor(bgCur);scene.fog.color.copy(bgCur);
    // planets: each star eases toward its orbital position around its sun
    for(let i=0;i<N;i++){const h=homes[i];
      orbV.copy(h.off).applyAxisAngle(h.axis,time*h.speed).add(h.anchor);
      const p=worldPos[i];p.lerp(orbV,0.07);
      pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;}
    geo.attributes.position.needsUpdate=true;
    // suns breathe — glow swells and settles, each on its own phase
    for(const k in sunGlows){const s=glowBase[k]*(1+.045*Math.sin(time*.9+glowPhase[k]));sunGlows[k].scale.set(s,s,1);}
    if(interior)animateInterior(time);   // code moons orbit the inner core
    // when a wide code board is open, lens-shift the scene left so it fills the
    // visible half rather than sitting behind the panel
    {const W=window.innerWidth,H=window.innerHeight;
     const wantOff=(interior&&panel.classList.contains("open")&&panel.classList.contains("wide"))?W*0.25:0;
     viewOffX+=(wantOff-viewOffX)*0.12;
     if(viewOffX>0.5){camera.setViewOffset(W,H,viewOffX,0,W,H);}
     else if(camera.view&&camera.view.enabled){camera.clearViewOffset();}}
    // search sun: ease into (or out of) being
    sunScale+=(sunScaleTarget-sunScale)*0.08;
    if(sunScale<0.02&&!sunScaleTarget){searchSun.visible=searchGlow.visible=false;}
    else{searchSun.visible=searchGlow.visible=true;
      searchSun.scale.setScalar(Math.max(.001,sunScale));
      const gs=52*sunScale*(1+.05*Math.sin(time*1.6));
      searchGlow.scale.set(gs,gs,1);}
    // constellation lines: rays from the focus sun to its orbiting signals
    lineMat.opacity+=(lineOpTarget-lineMat.opacity)*0.045;  // slow sketch-in
    if(lineIdx.length&&lineMat.opacity>0.005){
      for(let k=0;k<lineIdx.length;k++){const p=worldPos[lineIdx[k]];
        linePos[k*6]=0;linePos[k*6+1]=0;linePos[k*6+2]=0;
        linePos[k*6+3]=p.x;linePos[k*6+4]=p.y;linePos[k*6+5]=p.z;}
      lineGeo.setDrawRange(0,lineIdx.length*2);
      lineGeo.attributes.position.needsUpdate=true;
    }else lineGeo.setDrawRange(0,0);
    // birth pulse: one expanding ring when a sun comes into being
    if(pulseRequest){pulseRequest=false;pulseStart=time;}
    const pt=(time-pulseStart)/1.1;
    if(pt>=0&&pt<=1){pulse.visible=true;
      const ps=4+pt*86;pulse.scale.setScalar(ps);
      pulse.material.opacity=(1-pt)*(1-pt)*.5;
      pulse.quaternion.copy(camera.quaternion);
    }else pulse.visible=false;
    // click flash: a spark on the star you just selected
    if(flashRequest){flashRequest=false;flashStart=time;}
    const ft=(time-flashStart)/.5;
    if(ft>=0&&ft<=1&&flashI>=0){
      flash.position.copy(worldPos[flashI]);
      flash.material.opacity=Math.sin(ft*Math.PI)*.85;
      const fsc=8+ft*7;flash.scale.set(fsc,fsc,1);
    }else flash.material.opacity=0;
    // shooting star: a brief streak across the deep field, then a long wait
    if(time>metNext){
      metStart=time;metNext=time+16+Math.random()*28;
      const r1=()=>Math.random()*2-1;
      metFrom.set(r1(),r1()*.5,r1()).normalize().multiplyScalar(430);
      metTo.copy(metFrom).add(tmp.set(r1(),r1()*.4,r1()).normalize().multiplyScalar(260));
    }
    const mt=(time-metStart)/1.3;
    if(mt>=0&&mt<=1){
      trailMat.opacity=Math.sin(mt*Math.PI)*.65;
      for(let s2=0;s2<trailN;s2++){const tt=Math.max(0,mt-s2*.012);
        tmp.copy(metFrom).lerp(metTo,tt);
        trailPos[s2*3]=tmp.x;trailPos[s2*3+1]=tmp.y;trailPos[s2*3+2]=tmp.z;}
      trailGeo.attributes.position.needsUpdate=true;
    }else trailMat.opacity=0;
    if((frameN++&1)===0)positionLabels();   // labels track the orbits (every other frame)
    dofMat.uniforms.focusDist.value=camera.position.distanceTo(controls.target);
    dofMat.uniforms.scale.value=window.innerHeight*Math.min(devicePixelRatio,2)*0.5;
    const rct=cv.getBoundingClientRect();
    for(const k in labels){tmp.copy(anchors[k]).project(camera);const vis=tmp.z<1&&!rel&&!interior&&!flyPhase;labels[k].style.display=vis?"block":"none";labels[k].style.left=(rct.left+(tmp.x*.5+.5)*rct.width)+"px";labels[k].style.top=(rct.top+(-tmp.y*.5+.5)*rct.height)+"px";}
    // cluster (theme) suns: ease in/out, breathe, and float their keyword label
    for(let c=0;c<MAXCLUST;c++){
      const on=(c<activeClusters)&&!!rel&&!interior&&!flyPhase;
      clustScale[c]+=((on?1:0)-clustScale[c])*0.1;
      const mesh=clustSuns[c],glow=clustGlows[c],lab=clustLabels[c];
      if(clustScale[c]<0.02){mesh.visible=glow.visible=false;lab.style.display="none";continue;}
      mesh.visible=glow.visible=true;
      mesh.position.copy(clustAnchor[c]);glow.position.copy(clustAnchor[c]);
      mesh.scale.setScalar(Math.max(.001,clustScale[c]*2.4));
      mesh.material.uniforms.uOpacity.value=clustScale[c];
      const gs=20*clustScale[c]*(1+.05*Math.sin(time*1.1+c*1.3));glow.scale.set(gs,gs,1);
      tmp.copy(clustAnchor[c]).project(camera);
      if(tmp.z<1&&clustScale[c]>0.4){lab.style.display="block";
        lab.style.left=(rct.left+(tmp.x*.5+.5)*rct.width)+"px";
        lab.style.top=(rct.top+(-tmp.y*.5+.5)*rct.height-20)+"px";}
      else lab.style.display="none";
    }
    // the search sun's name floats above it
    if(rel&&sunScale>0.1){tmp.set(0,0,0).project(camera);
      sunLabel.style.display=tmp.z<1?"block":"none";
      sunLabel.style.left=(rct.left+(tmp.x*.5+.5)*rct.width)+"px";
      sunLabel.style.top=(rct.top+(-tmp.y*.5+.5)*rct.height-26)+"px";
    }else sunLabel.style.display="none";
    renderer.render(scene,camera);
    requestAnimationFrame(frame);}
  positionLabels(); frame();
};

</script>
<script>
(function(){
  if(!window.DATA||!window.DATA.length){ var n=document.getElementById('__nodata'); if(n)n.style.display='grid'; return; }
  try{ if(typeof window.__initExplore==='function') window.__initExplore(); }catch(e){ console.error('universe init failed',e); }
  var b=document.getElementById('u-back');
  if(b)b.addEventListener('click',function(ev){ev.preventDefault(); try{ if(window.parent&&window.parent.__exitUniverse) window.parent.__exitUniverse(); }catch(e){}});
})();
</script>
