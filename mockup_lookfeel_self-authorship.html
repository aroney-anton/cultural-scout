function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,t){ return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`; }
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// intro list
const cl = document.getElementById('codelist');
CODES.forEach((c,i)=>{
  const a = document.createElement('a');
  a.href = '#'+c.id;
  a.innerHTML = `<span class="num">0${i+1}</span><span class="dot" style="background:${c.palette[c.palette.length-1]}"></span>${c.name}`;
  cl.appendChild(a);
});

// code sections
const main = document.getElementById('codes');
const spanPattern = ['big','','tall','','wide','','tall','','','wide','','tall'];
CODES.forEach((c,i)=>{
  const sec = document.createElement('section');
  sec.className = 'code';
  sec.id = c.id;
  sec.dataset.bg = c.bg;
  sec.style.color = c.text;
  sec.style.setProperty('--tx', c.text);

  const tiles = c.imgs.map((src,j)=>{
    const k = spanPattern[j % spanPattern.length];
    return `<figure class="${k}"><img src="${src}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.closest('figure').remove()"></figure>`;
  }).join('');
  const sw = c.palette.map(p=>`<span style="background:${p}"></span>`).join('');
  const visualChips = c.visual.map(v=>`<span class="chip">${esc(v)}</span>`).join('');
  const verbalChips = c.verbal.map(v=>`<span class="chip">${esc(v)}</span>`).join('');
  const quotes = c.quotes.map(q=>`<div class="quote"><span class="q">“${esc(q.q)}”</span> <a href="${q.url}" target="_blank" rel="noopener">${esc(q.src)} →</a></div>`).join('');
  const ev = c.evidence.map(e=>`<a href="${e.u}" target="_blank" rel="noopener">${esc(e.s)} →</a>`).join('');

  sec.innerHTML = `
    <div class="hero">
      <div class="text">
        <div class="num">0${i+1} / 05</div>
        <span class="status">${c.status}</span>
        <h2>${c.name}</h2>
        <p class="oneliner">${c.oneliner}</p>
        <div class="palette">${sw}</div>
        <div class="scrollon">Scroll for the analysis ↓</div>
      </div>
      <div class="collage">${tiles}</div>
    </div>
    <div class="analysis">
      <p class="def">${esc(c.def)}</p>
      <div class="grid2">
        <div class="block"><div class="label">Visual register</div><div class="chips">${visualChips}</div></div>
        <div class="block"><div class="label">Verbal register</div><div class="chips">${verbalChips}</div><div class="quotes">${quotes}</div></div>
        <div class="block"><div class="label">Against</div><div class="body">${esc(c.against)}</div></div>
        <div class="block"><div class="label">Execution</div><div class="body">${esc(c.execution)}</div></div>
        <div class="block full"><div class="label">Evidence</div><div class="ev">${ev}</div></div>
        <div class="meta"><span>${esc(IMG_NOTE)}</span><span>Trajectory · ${esc(c.trajectory)}</span></div>
      </div>
    </div>`;
  main.appendChild(sec);
});

// scroll color morph
const bg = document.getElementById('bg');
const stops = [...document.querySelectorAll('.code')].map(s=>({el:s, rgb:hexRgb(s.dataset.bg)}));
function paint(){
  const vh = window.innerHeight;
  const mid = window.scrollY + vh*0.5;
  const introH = document.getElementById('intro').offsetHeight;
  if(mid < stops[0].el.offsetTop){
    const t = Math.max(0, Math.min(1, (mid - introH*0.4) / (introH*0.6)));
    bg.style.backgroundColor = mix(INTRO_BG, stops[0].rgb, t);
    return;
  }
  let idx = 0;
  for(let i=0;i<stops.length;i++){ if(mid >= stops[i].el.offsetTop) idx = i; }
  const cur = stops[idx];
  const next = stops[idx+1] || cur;
  const start = cur.el.offsetTop;
  const end = stops[idx+1] ? stops[idx+1].el.offsetTop : start + cur.el.offsetHeight;
  const t = Math.max(0, Math.min(1, (mid - start) / (end - start)));
  const tt = t < 0.7 ? 0 : (t - 0.7) / 0.3;
  bg.style.backgroundColor = mix(cur.rgb, next.rgb, tt);
}
let ticking=false;
window.addEventListener('scroll',()=>{ if(!ticking){ requestAnimationFrame(()=>{paint();ticking=false;}); ticking=true; } },{passive:true});
window.addEventListener('resize',paint);
paint();
</script>
</body>
</html>
