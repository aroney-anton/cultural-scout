  # ==========================================================================
  # SEMIOTIC-ONLY VISUAL POOL 2026-07-09 — 17 image-rich fashion + photography
  # sources (Michael's ask). EVERY entry below carries `semiotic_only: true`.
  #
  # WHAT THIS MEANS (hard rule):
  #  - These sources are for the SEMIOTIC / codebook image stage ONLY (image_scraper).
  #  - They are NOT harvested in the monthly cultural harvest, NOT signal-tagged
  #    (Layer 2), NOT merged into corpus.json, and NOT added to provenance.json /
  #    the Field Guide. They carry zero corpus signals and never touch need-share
  #    or the pulse.
  #  - The DISTINCTIVENESS GATE does NOT apply to them. It stays in force for signal
  #    tagging; but for semiotic coding, ALL articles/content from ALL listed sources
