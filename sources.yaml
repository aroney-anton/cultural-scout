# Cultural Thought-Starter System — Source Config
#
# Sources are the editorial filter. Do not silently change this list.
# `fetchable: false` means the source is on the editorial list but cannot be
# harvested by the current pipeline (e.g. Instagram). It is documented here
# so it doesn't get silently dropped.
# `recent_url_uncertain: true` means I (Claude) am not confident the URL
# below actually surfaces recent content. Verify before relying on harvest.
# `semiotic_only: true` (added 2026-07-09) means the source is a SEMIOTIC-CODING
# image pool ONLY. It is NOT harvested in the monthly cultural harvest, NOT
# signal-tagged, NOT merged into corpus.json, and NOT listed in provenance.json /
# the Field Guide. It exists solely as a URL-fed image source for the semiotic /
# codebook stage (image_scraper), where the distinctiveness gate does NOT apply
# and ALL content from ALL listed sources is in scope. See the SEMIOTIC-ONLY
# section at the bottom of this file and the 2026-07-09 CLAUDE.md header block.

harvest:
  date_range_days: 90
  items_per_source_min: 8
  items_per_source_max: 15

categories:
  art: "Contemporary art and visual culture"
  fashion: "Independent fashion, beauty, and style criticism"
  consumer: "Consumer culture and brand-watching"
  entertainment: "Entertainment, media, and criticism"
  internet: "Internet culture and linguistics"
  embodied: "Embodied culture, food futures, and bodily life"
  intellectual: "Intellectual life, meaning, and the management of felt weight"
  design_school: "Design school output (graduate work, exhibitions, leads commercial cycle by 12-36 months)"
  history: "Leading-edge history — how established historical narratives are being reconceived (upstream of the Settling Accounts need)"
  global: "Globally oriented culture writing from inside non-Western regions and diasporas"
  museum: "Major art institutions — editorial (magazine/essays/criticism) PLUS exhibition & programming, read as a leading indicator of what the art world is canonizing (institutional-validation signal). Each entry carries an extra exhibitions_url; harvest BOTH arms (see the museum-wave header in sources for the harvest rules)."
  sport: "Sport read as culture and interiority, not results — fandom, the body, scene-building, and the meaning we make of play. Added 2026-06-29; in-milieu (the cultural register of sport), NOT scores/analytics/betting."
  games: "Videogame criticism and games culture — long-form, cultural-context games writing and the scenes around it. Added 2026-06-29; the criticism/essay register, NOT reviews/news/industry analyst coverage."
  photography: "Photography and image-culture publications. Added 2026-07-09 to label the semiotic-only visual pool (see the SEMIOTIC-ONLY section). These sources are semiotic_only:true — they carry ZERO corpus signals and never appear in the Field Guide; the category exists to describe the image pool, not to expand corpus intake."

