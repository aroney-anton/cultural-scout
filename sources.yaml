  # ==========================================================================
  # MUSEUM WAVE 2026-06-22 — 12 art institutions added (user request). These are
  # INSTITUTIONS, not editorial publications, so each carries TWO harvest targets:
  #   - recent_url      → the editorial arm (magazine / essays / criticism)
  #   - exhibitions_url → current + upcoming exhibitions & programming
  # WHY: user wants the institutional-VALIDATION signal (what the art world is
  # canonizing) + a more VISUAL register than the newsletter tier + deliberate
  # non-Western coverage. The 8 named are NYC/London/Paris-heavy; the 4 suggested
  # adds (mplus/sharjah/ngs/zeitz) are the East-Asia/MENA/SE-Asia/Africa balance.
  # HARVEST RULES for this wave (an explicit exception to the usual bar):
  #  - Exhibition/programming pages ARE announcements, and that is the point: a
  #    show going up at the Met / Tate / M+ IS the validation signal. Treat them
  #    like the Strategist/Thingtesting exception — the announcement is the
  #    editorial product. Capture title, venue, date range, artists, curatorial
  #    framing; skip pure logistics (hours, ticketing, galas).
  #  - From the editorial arm, keep the usual essays/criticism/interviews/
  #    curatorial features. These sources carry the IMAGERY the newsletter tier
  #    lacks — weight image-rich pieces + show pages (feeds the semiotic-codes pilot).
  #  - Dedup by URL as always (tate-modern + tate-britain share the Tate Etc.
  #    editorial; harvest dedups it — their distinct signal is each programme).
  #  - FETCHABILITY varies a lot (verified 2026-06-22): Whitney/Tate/Pompidou/M+/
  #    Sharjah/NGS/Zeitz are GREEN; MoMA is YELLOW (use press.moma.org + search);
  #    the Met is RED (Vercel bot-block, no fallback — search-grounding only);
  #    MASP/White Rabbit have domain/structure caveats. See each note.
  #  - NEXT-RUN TODO: museums are a non-cultural intake change — at the harvest
  #    that first ingests them, add a RUN_NOTES entry in build_corpus.py and spin
  #    up parallel agent(s) for this category (workload grows).
  # ==========================================================================

  - name: the-met
    category: museum
    base_url: https://www.metmuseum.org
    recent_url: https://www.metmuseum.org/perspectives
    exhibitions_url: https://www.metmuseum.org/exhibitions
    recent_url_uncertain: true
    note: "ADDED 2026-06-22 (museum wave). The Metropolitan Museum of Art, NYC. EDITORIAL = 'Perspectives' (metmuseum.org/perspectives) — a deep, actively-published online magazine: long-form essays, 'Meet the Artist' interviews, '<X> in N objects' curatorial features; individually slugged, multiple/month, tied to current shows (verified 2026-dated pieces, e.g. 'Raphael: A Life in Nine Objects'). EXHIBITIONS = /exhibitions, each show its own dated page. FETCHABILITY = RED for direct WebFetch: metmuseum.org sits behind a Vercel bot-management challenge (HTTP 429 / x-vercel-mitigated) to all non-browser clients, and its press subdomain is dead — there is NO fetchable fallback. Ground dates/summaries via domain-scoped WebSearch only (same playbook as nymag/eater), or a headless fetcher if one is ever built. Strongly image-rich. Filter Perspectives to essays/interviews/curatorial (skip tours/member/event entries)."

  - name: whitney
    category: museum
    base_url: https://whitney.org
    recent_url: https://whitney.org/essays
    exhibitions_url: https://whitney.org/exhibitions
    note: "ADDED 2026-06-22 (museum wave). Whitney Museum of American Art, NYC. The CLEANEST-fetching of the NYC three (GREEN — /essays, individual essays, /exhibitions, /press, /press/archive all return real dated body content + image refs, no SPA shell, no block). EDITORIAL = /essays — long-form curatorial criticism by Whitney curators, individually URL'd (/essays/<slug>), image-dense (e.g. 'The Self as Cipher: Salman Toor's Narrative Paintings'). TWO caveats: cadence is LOW (~5-8 essays/year, pegged to exhibitions) and dating is COARSE (listing shows year only; essay bodies often carry no visible date — date to year). EXHIBITIONS = /exhibitions, richly dated + 50+ images per show (Whitney Biennial 2026, etc.); strong, image-led. Press/acquisitions: /press/archive (641 dated releases). Weight high per editorial item given the low volume."

